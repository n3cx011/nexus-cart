server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://auth-db:5432/nexus_auth_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
  app:
    api:
      key: NEXUS_SECURE_API_KEY_2026