version: '3.8'

services:
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: nexus_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - nexus-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/nexus_auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - auth-db
    networks:
      - nexus-network

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: nexus_order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - order_pgdata:/var/lib/postgresql/data
    networks:
      - nexus-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8080"
    environment:
      - DB_HOST=order-db
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/nexus_order_db
    depends_on:
      - order-db
    networks:
      - nexus-network

volumes:
  auth_pgdata:
  order_pgdata:

networks:
  nexus-network:
    driver: bridge